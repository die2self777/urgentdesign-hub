<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgent Design — EdTech Ecosystem</title>

<!-- EL Arcade Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --app-bg: oklch(0.99 0 0);         
    --card-bg: oklch(1 0 0);           
    --text-main: oklch(0.14 0 0);      
    --text-muted: oklch(0.46 0 0);     
    --primary: oklch(0.74 0.19 145);   
    --border-soft: oklch(0.9 0 0);     
    
    --radius-lg: 0.5rem;               
    --radius-md: calc(0.5rem - 2px);
    --radius-sm: calc(0.5rem - 4px);
    
    --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-hover: 0 10px 24px rgba(0,0,0,0.06);
  }

  html { scroll-behavior: smooth; }

  /* SUBTLE SVG GRID BACKGROUND */
  body, .curtain-reveal {
    background-color: var(--app-bg);
    background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 39.5h40M39.5 0v40' stroke='rgba(15,23,42,0.03)' stroke-width='1' fill='none'/%3E%3C/svg%3E");
    color: var(--text-main);
    font-family: var(--font-display);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 {
    letter-spacing: -0.025em;
    font-weight: 700;
  }

  .page { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  /* ── APPLE-STYLE FROSTED GLASS HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-soft);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem 0.5rem; 
    gap: 2rem;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: baseline; gap: 0.35rem; }
  .logo-mark { font-size: 1.25rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.025em; }
  .logo-tld { font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); font-weight: 500; }

  /* ── SEARCH BAR ── */
  .header-search { flex-grow: 1; max-width: 400px; display: flex; align-items: center; position: relative; }
  .header-search i { position: absolute; left: 14px; color: var(--text-muted); font-size: 1.1rem; pointer-events: none; }
  #app-search {
    width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; border-radius: 100px;
    border: 1px solid var(--border-soft); background: rgba(15,23,42,0.03);
    font-family: var(--font-display); font-size: 0.85rem; color: var(--text-main);
    outline: none; transition: all 0.2s;
  }
  #app-search:focus { background: var(--card-bg); border-color: var(--primary); box-shadow: 0 0 0 3px rgba(18, 185, 129, 0.1); }
  #app-search::placeholder { color: var(--text-muted); opacity: 0.7; }

  /* ── DYNAMIC CATEGORY NAV ── */
  .category-nav {
    display: flex; gap: 1.5rem; padding: 0.5rem 2rem 1rem;
    overflow-x: auto; scrollbar-width: none;
  }
  .category-nav::-webkit-scrollbar { display: none; }
  .category-link {
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);
    text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap; transition: color 0.2s;
  }
  .category-link:hover { color: var(--text-main); }

  /* ── STICKY HERO ── */
  .sticky-hero-container {
    position: sticky;
    top: 140px; 
    z-index: 1;
    padding-bottom: 8rem; 
  }

  .hero { padding: 4rem 0 2rem; text-align: left; }
  .hero-eyebrow { 
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem; 
    color: var(--text-main); 
    background: oklch(0.96 0 0); 
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    letter-spacing: 0.05em; 
    text-transform: uppercase; 
    margin-bottom: 1.5rem; 
  }
  .hero-title { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; line-height: 1.05; color: var(--text-main); margin-bottom: 1.5rem; }
  .hero-title span { color: var(--primary); }
  .hero-sub { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; max-width: 600px; }

  /* ── CURTAIN REVEAL ── */
  .curtain-reveal {
    position: relative;
    z-index: 10;
    border-top: 1px solid var(--border-soft);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.03); 
    padding-top: 2rem;
    min-height: 100vh; 
  }

  /* ── APPS GRID & OFFSETS ── */
  .category-section { scroll-margin-top: 130px; } /* Ensures the header doesn't cover the title when scrolling */
  
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-top: 1rem; }
  .section-label { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-main); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .section-count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
    margin-bottom: 4rem;
  }

  /* ── APP CARDS & STAGGERED REVEAL CSS ── */
  .app-card {
    background: var(--card-bg);
    padding: 1.75rem;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-soft);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 15;
    
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  
  .app-card.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .app-card.revealed:hover { 
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
  }

  /* ── BENTO BOX FEATURED CARD ── */
  @media (min-width: 768px) {
    .app-card.featured { grid-column: span 2; }
    .app-card.featured .card-name { font-size: 1.4rem; }
  }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-icon {
    width: 44px; height: 44px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: oklch(0.96 0 0);
    color: var(--text-main);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  
  .card-icon i { font-family: 'tabler-icons' !important; font-style: normal; }

  .app-card:hover .card-icon { background: var(--primary); color: var(--app-bg); }

  .card-status { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--radius-sm); font-weight: 500; border: 1px solid transparent; }
  .status-live { color: var(--app-bg); background: var(--primary); } 
  .status-beta { color: oklch(0.14 0 0); background: oklch(0.82 0.17 90); } 
  .status-wip  { color: var(--text-muted); background: oklch(0.96 0 0); }

  .card-name { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.4rem; letter-spacing: -0.01em; }
  .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 1.25rem; border-top: 1px solid var(--border-soft); }
  .card-url { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
  .card-arrow { font-size: 1rem; color: var(--text-muted); transition: transform 0.2s, color 0.2s; }
  .app-card:hover .card-arrow { transform: translate(3px, -3px); color: var(--primary); }

  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-family: var(--font-mono); font-size: 0.65rem; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--app-bg); color: var(--text-muted); border: 1px solid var(--border-soft); }

  .state-msg { grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; }

  footer {
    border-top: 1px solid var(--border-soft);
    padding: 2rem 0 3rem;
    margin-top: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--text-main); }
</style>
</head>
<body>

  <!-- STICKY FROSTED HEADER -->
  <header>
    <div class="page header-inner">
      <div class="logo">
        <span class="logo-mark">Urgent Design</span>
        <span class="logo-tld">.app</span>
      </div>
      
      <div class="header-search">
        <i class="ti ti-search"></i>
        <input type="text" id="app-search" placeholder="Search tools, tags, or descriptions..." autocomplete="off">
      </div>
    </div>
    
    <!-- Dynamic Nav Container -->
    <nav class="page category-nav" id="category-nav"></nav>
  </header>

  <!-- BACKGROUND STICKY HERO -->
  <div class="sticky-hero-container">
    <section class="hero page">
      <p class="hero-eyebrow">Micro-App Hub</p>
      <h1 class="hero-title">
        Tools built for<br>
        <span>language learners.</span>
      </h1>
      <p class="hero-sub">A decoupled suite of AI-assisted learning tools. Built by well-loved, long-suffering teachers, in response to real classroom needs.</p>
    </section>
  </div>

  <!-- FOREGROUND CURTAIN REVEAL -->
  <div class="curtain-reveal">
    <div class="page">
      <div id="ecosystem-container">
        <div class="state-msg">Fetching ecosystem…</div>
      </div>

      <footer>
        <span id="last-updated">urgentdesign.app</span>
        <span>
          <a href="https://supabase.com" target="_blank" rel="noopener">supabase</a>
          &nbsp;·&nbsp;
          <a href="https://notion.so" target="_blank" rel="noopener">notion</a>
        </span>
      </footer>
    </div>
  </div>

<script>
function buildCard(app) {
  const url = app.url || '';
  const displayUrl = url.replace('https://', '');
  const statusClass = { live: 'status-live', beta: 'status-beta', wip: 'status-wip' }[app.status] || 'status-wip';
  const tags = (app.tags || []);
  const tagsHtml = tags.map(t => `<span class="tag">${t}</span>`).join('');
  
  const isFeatured = app.featured === true;
  const featuredClass = isFeatured ? 'featured' : '';

  // Consolidate text for the live search engine
  const searchableText = `${app.name} ${app.description || ''} ${tags.join(' ')} ${url}`.toLowerCase().replace(/"/g, '');

  return `
    <a class="app-card ${featuredClass}" href="${url}" target="_blank" rel="noopener" data-searchable="${searchableText}">
      <div class="card-top">
        <div class="card-icon"><i class="ti ti-${app.icon || 'app-window'}"></i></div>
        <span class="card-status ${statusClass}">${app.status || 'wip'}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${app.name}</div>
        <p class="card-desc">${app.description}</p>
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-url">${displayUrl}</span>
        <span class="card-arrow">↗</span>
      </div>
    </a>`;
}

async function loadApps() {
  const container = document.getElementById('ecosystem-container');
  const navContainer = document.getElementById('category-nav');
  const lastUpdated = document.getElementById('last-updated');

  try {
    const res = await fetch(`/apps.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const apps = await res.json();

    if (!apps.length) {
      container.innerHTML = '<div class="state-msg">No apps deployed yet.</div>';
      return;
    }

    const grouped = {};
    apps.forEach(app => {
      const cat = app.category || 'General Tools';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(app);
    });

    container.innerHTML = '';
    navContainer.innerHTML = '';

    Object.keys(grouped).sort().forEach(category => {
      const categoryApps = grouped[category];
      const liveCount = categoryApps.filter(a => a.status === 'live').length;
      
      // Create a URL-safe ID for the anchor links
      const sectionId = 'cat-' + category.toLowerCase().replace(/[^a-z0-9]+/g, '-');

      // 1. Build the Header Nav Link
      navContainer.insertAdjacentHTML('beforeend', `<a href="#${sectionId}" class="category-link">${category}</a>`);

      // 2. Build the App Section
      const sectionHtml = `
        <div class="category-section" id="${sectionId}">
          <div class="section-header">
            <span class="section-label">${category}</span>
            <span class="section-count">${categoryApps.length} Apps · ${liveCount} Live</span>
          </div>
          <div class="apps-grid">
            ${[...categoryApps].reverse().map(buildCard).join('')}
          </div>
        </div>
      `;
      
      container.insertAdjacentHTML('beforeend', sectionHtml);
    });

    lastUpdated.textContent = `urgentdesign.app · updated ${new Date().toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' })}`;

    setupScrollReveal();
    setupLiveSearch();

  } catch (err) {
    container.innerHTML = `<div class="state-msg">Could not load apps.json<br><span style="font-size:0.75rem;opacity:0.7">${err.message}</span></div>`;
  }
}

function setupScrollReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        setTimeout(() => { entry.target.style.transitionDelay = '0s'; }, 600);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.apps-grid').forEach(grid => {
    const cards = grid.querySelectorAll('.app-card');
    cards.forEach((card, index) => {
      card.style.transitionDelay = `${(index % 3) * 0.1}s`;
      observer.observe(card);
    });
  });
}

function setupLiveSearch() {
  const searchInput = document.getElementById('app-search');
  
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    
    document.querySelectorAll('.category-section').forEach(section => {
      let hasVisibleCards = false;
      
      section.querySelectorAll('.app-card').forEach(card => {
        const searchableText = card.getAttribute('data-searchable');
        
        if (searchableText.includes(term)) {
          card.style.display = 'flex';
          hasVisibleCards = true;
          // Ensure it's fully visible immediately if found during search
          card.classList.add('revealed');
          card.style.transitionDelay = '0s'; 
        } else {
          card.style.display = 'none';
        }
      });
      
      // Hide the entire category wrapper if no apps match inside it
      section.style.display = hasVisibleCards ? 'block' : 'none';
    });
  });
}

loadApps();
// --- NEW PASSWORD INTERCEPTOR ---
// We use Event Delegation because your app cards are loaded dynamically AFTER the page loads.
document.addEventListener("click", function(event) {
  
  // Check if the clicked element (or its parent) is an app-card link
  const appCard = event.target.closest('a.app-card');
  
  // If they clicked an app card, intercept it
  if (appCard) {
    event.preventDefault(); // Stop immediate navigation
    
    const password = prompt("Enter the class password:");
    
    if (password === "pikachu") { 
      // Open the app in a new tab (respecting your original target="_blank" design)
      window.open(appCard.href, '_blank');
    } else if (password !== null) {
      alert("Incorrect password. Try again!");
    }
  }
});

</script>
</body>
</html>
