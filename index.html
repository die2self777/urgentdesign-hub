<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgent Design — EdTech Ecosystem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0b;
    --bg2: #141410;
    --bg3: #1c1c17;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede4;
    --muted: rgba(240,237,228,0.5);
    --dim: rgba(240,237,228,0.25);
    --radius: 12px;
    --radius-sm: 6px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .logo { display: flex; align-items: baseline; gap: 0.5rem; }
  .logo-mark { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
  .logo-tld { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--dim); font-style: italic; }

  .header-meta { font-size: 0.7rem; color: var(--dim); text-align: right; line-height: 1.4; }
  .header-meta span { display: block; }
  #last-updated { color: var(--muted); }

  .hero { padding: 5rem 0 4rem; }
  .hero-eyebrow { font-size: 0.7rem; color: #1D9E75; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.25rem; }
  .hero-title { font-family: 'Fraunces', serif; font-size: clamp(2.8rem, 7vw, 5.5rem); font-weight: 300; line-height: 1.05; letter-spacing: -0.03em; color: var(--text); margin-bottom: 1.5rem; }
  .hero-title em { font-style: italic; font-weight: 300; color: var(--muted); }
  .hero-sub { max-width: 540px; color: var(--muted); font-size: 0.875rem; line-height: 1.75; }

  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; padding-top: 1rem; }
  .section-label { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
  #app-count { font-size: 0.7rem; color: var(--dim); font-style: italic; }

  #apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 4rem;
  }

  .app-card {
    background: var(--bg2);
    padding: 1.75rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: background 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .app-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, transparent);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .app-card:hover { background: var(--bg3); }
  .app-card:hover::before { opacity: 1; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--icon-bg, rgba(255,255,255,0.05)); color: var(--icon-color, var(--muted)); flex-shrink: 0; }

  .card-status { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; border: 1px solid currentColor; opacity: 0.7; }
  .status-live { color: #1D9E75; }
  .status-beta { color: #EF9F27; }
  .status-wip { color: var(--dim); }

  .card-name { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; margin-bottom: 0.4rem; }
  .card-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.65; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.5rem; border-top: 1px solid var(--border); }
  .card-url { font-size: 0.7rem; color: var(--dim); font-style: italic; }
  .card-arrow { font-size: 0.75rem; color: var(--dim); transition: transform 0.2s, color 0.2s; }
  .app-card:hover .card-arrow { transform: translate(3px, -3px); color: var(--icon-color); }

  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.65rem; padding: 2px 7px; border-radius: 100px; background: var(--bg3); color: var(--dim); border: 1px solid var(--border); letter-spacing: 0.04em; }

  .state-msg { grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--dim); font-style: italic; font-size: 0.85rem; }

  footer { border-top: 1px solid var(--border); padding: 2rem 0; display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 0.7rem; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">
      <span class="logo-mark">Urgent Design</span>
      <span class="logo-tld">.app</span>
    </div>
    <div class="header-meta">
      <span>EdTech Ecosystem · Singapore</span>
      <span id="last-updated">—</span>
    </div>
  </header>

  <section class="hero">
    <p class="hero-eyebrow">// micro-app hub</p>
    <h1 class="hero-title">
      Tools built for<br>
      <em>language learners</em>
    </h1>
    <p class="hero-sub">A decoupled suite of AI-assisted learning tools. Built by a Lead Teacher, for real classroom use.</p>
  </section>

  <div class="section-header">
    <span class="section-label">// live apps</span>
    <span id="app-count">loading…</span>
  </div>

  <div id="apps-grid">
    <div class="state-msg">Fetching apps…</div>
  </div>

  <footer>
    <span>urgentdesign.app</span>
    <span>
      <a href="https://supabase.com" target="_blank" rel="noopener">supabase</a>
      &nbsp;·&nbsp;
      <a href="https://notion.so" target="_blank" rel="noopener">notion</a>
    </span>
  </footer>
</div>

<script>
const COLOR_MAP = {
  teal:   { accent: '#1D9E75', bg: 'rgba(29,158,117,0.12)' },
  purple: { accent: '#7F77DD', bg: 'rgba(127,119,221,0.12)' },
  blue:   { accent: '#378ADD', bg: 'rgba(55,138,221,0.12)' },
  amber:  { accent: '#EF9F27', bg: 'rgba(239,159,39,0.12)' },
  coral:  { accent: '#D85A30', bg: 'rgba(216,90,48,0.12)' },
  pink:   { accent: '#D4537E', bg: 'rgba(212,83,126,0.12)' },
};

function buildCard(app) {
  const { accent, bg } = COLOR_MAP[app.color] || COLOR_MAP.teal;
  const url = app.url;
  const displayUrl = url.replace('https://', '');

  const statusClass = { live: 'status-live', beta: 'status-beta', wip: 'status-wip' }[app.status] || 'status-wip';
  const tags = (app.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

  return `
    <a class="app-card" href="${url}" target="_blank" rel="noopener"
       style="--card-accent:${accent};--icon-bg:${bg};--icon-color:${accent}">
      <div class="card-top">
        <div class="card-icon"><i class="ti ti-${app.icon || 'app-window'}"></i></div>
        <span class="card-status ${statusClass}">${app.status}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${app.name}</div>
        <p class="card-desc">${app.description}</p>
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-url">${displayUrl}</span>
        <span class="card-arrow">↗</span>
      </div>
    </a>`;
}

async function loadApps() {
  const grid = document.getElementById('apps-grid');
  const counter = document.getElementById('app-count');
  const lastUpdated = document.getElementById('last-updated');

  try {
    const res = await fetch(`/apps.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const apps = await res.json();

    if (!apps.length) {
      grid.innerHTML = '<div class="state-msg">No apps deployed yet.</div>';
      counter.textContent = '0 apps';
      return;
    }

    grid.innerHTML = apps.map(buildCard).join('');
    const live = apps.filter(a => a.status === 'live').length;
    counter.textContent = `${apps.length} app${apps.length !== 1 ? 's' : ''} · ${live} live`;
    lastUpdated.textContent = `updated ${new Date().toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' })}`;

  } catch (err) {
    console.error('Failed to load apps.json:', err);
    grid.innerHTML = `<div class="state-msg">Could not load apps.json<br><span style="font-size:0.75rem;opacity:0.6">${err.message}</span></div>`;
    counter.textContent = '—';
  }
}

loadApps();
</script>
</body>
</html>
