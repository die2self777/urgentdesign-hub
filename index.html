<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgent Design — EdTech Ecosystem</title>

<!-- EL Arcade Fonts: Inter for UI, JetBrains Mono for accents -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<!-- FIXED: Corrected Tabler Icons path -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── EL ARCADE EXACT COLOR VARIABLES ── */
  :root {
    --app-bg: oklch(0.99 0 0);         /* Pure/Off White */
    --card-bg: oklch(1 0 0);           /* Pure White */
    --text-main: oklch(0.14 0 0);      /* Near-Black */
    --text-muted: oklch(0.46 0 0);     /* Muted Gray */
    --primary: oklch(0.74 0.19 145);   /* Sharp Electric Green */
    --border-soft: oklch(0.9 0 0);     /* Light Gray Border */
    
    --radius-lg: 0.5rem;               
    --radius-md: calc(0.5rem - 2px);
    --radius-sm: calc(0.5rem - 4px);
    
    --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-hover: 0 10px 24px rgba(0,0,0,0.06);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--app-bg);
    color: var(--text-main);
    font-family: var(--font-display);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 {
    letter-spacing: -0.025em;
    font-weight: 700;
  }

  .page { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  /* ── APPLE-STYLE FROSTED GLASS HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-soft);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 2rem; /* Adjusted for sticky header */
  }

  .logo { display: flex; align-items: baseline; gap: 0.35rem; }
  .logo-mark { font-size: 1.25rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.025em; }
  .logo-tld { font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); font-weight: 500; }

  .header-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-align: right; line-height: 1.5; }
  .header-meta span { display: block; }

  /* ── STICKY HERO (Background Layer) ── */
  .sticky-hero-container {
    position: sticky;
    top: 120px; /* Sits right below the header */
    z-index: 1;
    padding-bottom: 8rem; /* Creates scroll distance before curtain hits */
  }

  .hero { padding: 4rem 0 2rem; text-align: left; }
  .hero-eyebrow { 
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem; 
    color: var(--text-main); 
    background: oklch(0.96 0 0); 
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    letter-spacing: 0.05em; 
    text-transform: uppercase; 
    margin-bottom: 1.5rem; 
  }
  .hero-title { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; line-height: 1.05; color: var(--text-main); margin-bottom: 1.5rem; }
  .hero-title span { color: var(--primary); }
  .hero-sub { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; max-width: 600px; }

  /* ── CURTAIN REVEAL (Foreground Layer sliding over Hero) ── */
  .curtain-reveal {
    position: relative;
    z-index: 10;
    background: var(--app-bg); /* Solid background to hide hero */
    border-top: 1px solid var(--border-soft);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.03); /* Soft shadow cast on hero */
    padding-top: 2rem;
    min-height: 100vh; /* Ensures it covers completely */
  }

  /* ── APPS GRID ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-top: 1rem; }
  .section-label { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-main); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .section-count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
    margin-bottom: 4rem;
  }

  .app-card {
    background: var(--card-bg);
    padding: 1.75rem;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-soft);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
    position: relative;
    z-index: 15;
  }
  
  .app-card:hover { 
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
  }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-icon {
    width: 44px; height: 44px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: oklch(0.96 0 0);
    color: var(--text-main);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  
  /* Fix: Prevents Inter font from overriding the icon */
  .card-icon i { font-family: 'tabler-icons' !important; font-style: normal; }

  .app-card:hover .card-icon {
    background: var(--primary);
    color: var(--app-bg);
  }

  .card-status { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--radius-sm); font-weight: 500; border: 1px solid transparent; }
  .status-live { color: var(--app-bg); background: var(--primary); } 
  .status-beta { color: oklch(0.14 0 0); background: oklch(0.82 0.17 90); } /* Warning Yellow */
  .status-wip  { color: var(--text-muted); background: oklch(0.96 0 0); }

  .card-name { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.4rem; letter-spacing: -0.01em; }
  .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 1.25rem; border-top: 1px solid var(--border-soft); }
  .card-url { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
  .card-arrow { font-size: 1rem; color: var(--text-muted); transition: transform 0.2s, color 0.2s; }
  .app-card:hover .card-arrow { transform: translate(3px, -3px); color: var(--primary); }

  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-family: var(--font-mono); font-size: 0.65rem; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--app-bg); color: var(--text-muted); border: 1px solid var(--border-soft); }

  .state-msg { grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border-soft);
    padding: 2rem 0 3rem;
    margin-top: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--text-main); }
</style>
</head>
<body>

  <!-- STICKY FROSTED HEADER -->
  <header>
    <div class="page header-inner">
      <div class="logo">
        <span class="logo-mark">Urgent Design</span>
        <span class="logo-tld">.app</span>
      </div>
      <div class="header-meta">
        <span>EdTech Ecosystem</span>
        <span id="last-updated">—</span>
      </div>
    </div>
  </header>

  <!-- BACKGROUND STICKY HERO -->
  <div class="sticky-hero-container">
    <section class="hero page">
      <p class="hero-eyebrow">Micro-App Hub</p>
      <h1 class="hero-title">
        Tools built for<br>
        <span>language learners.</span>
      </h1>
      <p class="hero-sub">A decoupled suite of AI-assisted learning tools. Built by well-loved, long-suffering teachers, in response to real classroom needs.</p>
    </section>
  </div>

  <!-- FOREGROUND CURTAIN REVEAL -->
  <div class="curtain-reveal">
    <div class="page">
      
      <div id="ecosystem-container">
        <div class="state-msg">Fetching ecosystem…</div>
      </div>

      <footer>
        <span>urgentdesign.app</span>
        <span>
          <a href="https://supabase.com" target="_blank" rel="noopener">supabase</a>
          &nbsp;·&nbsp;
          <a href="https://notion.so" target="_blank" rel="noopener">notion</a>
        </span>
      </footer>
      
    </div>
  </div>

<script>
function buildCard(app) {
  const url = app.url;
  const displayUrl = url ? url.replace('https://', '') : '';
  const statusClass = { live: 'status-live', beta: 'status-beta', wip: 'status-wip' }[app.status] || 'status-wip';
  const tags = (app.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

  return `
    <a class="app-card" href="${url}" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="card-icon"><i class="ti ti-${app.icon || 'app-window'}"></i></div>
        <span class="card-status ${statusClass}">${app.status || 'wip'}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${app.name}</div>
        <p class="card-desc">${app.description}</p>
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-url">${displayUrl}</span>
        <span class="card-arrow">↗</span>
      </div>
    </a>`;
}

async function loadApps() {
  const container = document.getElementById('ecosystem-container');
  const lastUpdated = document.getElementById('last-updated');

  try {
    const res = await fetch(`/apps.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const apps = await res.json();

    if (!apps.length) {
      container.innerHTML = '<div class="state-msg">No apps deployed yet.</div>';
      return;
    }

    const grouped = {};
    apps.forEach(app => {
      const cat = app.category || 'General Tools';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(app);
    });

    container.innerHTML = '';

    Object.keys(grouped).sort().forEach(category => {
      const categoryApps = grouped[category];
      const liveCount = categoryApps.filter(a => a.status === 'live').length;

      const sectionHtml = `
        <div class="section-header">
          <span class="section-label">${category}</span>
          <span class="section-count">${categoryApps.length} Apps · ${liveCount} Live</span>
        </div>
        <div class="apps-grid">
          ${[...categoryApps].reverse().map(buildCard).join('')}
        </div>
      `;
      
      container.insertAdjacentHTML('beforeend', sectionHtml);
    });

    lastUpdated.textContent = `updated ${new Date().toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' })}`;

  } catch (err) {
    container.innerHTML = `<div class="state-msg">Could not load apps.json<br><span style="font-size:0.75rem;opacity:0.7">${err.message}</span></div>`;
  }
}

loadApps();
</script>
</body>
</html>
